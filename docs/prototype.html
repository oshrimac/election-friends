<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>הקלפי — תחזיות בחירות בין חברים</title>
<style>
html{color-scheme:light dark;background:light-dark(#e9ede7,#101916)}
body{margin:0;padding:24px;font-family:Arial,sans-serif}
#ballot-app{max-width:1200px;margin:0 auto}
@media(max-width:600px){body{padding:8px}}
</style>
</head>
<body>
<div id="ballot-app" dir="rtl" lang="he">
<style>
#ballot-app{--page:light-dark(#f4f5f2,#14201f);--surface:light-dark(#fff,#1c2c29);--ink:light-dark(#183832,#e4efe7);--quiet:light-dark(#697c75,#acc0b5);--stroke:light-dark(#e4eae3,#334740);--soft:light-dark(#e9f1e8,#2b4235);--brand:light-dark(#1c654d,#b9e29a);--onbrand:light-dark(#fff,#183529);font-family:Arial,sans-serif;color:var(--ink);background:var(--page);border-radius:20px;overflow:hidden;color-scheme:light dark;font-size:14px;line-height:1.55}
#ballot-app *{box-sizing:border-box}#ballot-app button,#ballot-app input,#ballot-app select{font:inherit}#ballot-app button{cursor:pointer}#ballot-app button:disabled{cursor:default;opacity:.45}#ballot-app button{border:0}#ballot-app .layout{display:grid;grid-template-columns:185px minmax(0,1fr);min-height:760px}#ballot-app aside{background:light-dark(#163c32,#0e2b24);color:#eaf4e9;padding:30px 18px;display:flex;flex-direction:column;gap:30px}#ballot-app .brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:700;letter-spacing:-1px}#ballot-app .mark{background:#c9e3a8;color:#173f30;padding:2px 11px;border-radius:10px;transform:rotate(-8deg);font-size:26px}#ballot-app .slogan{color:#b5cbbf;font-size:12px;margin-top:8px}#ballot-app nav{display:grid;gap:7px}#ballot-app nav button{text-align:right;background:transparent;color:#bfcec5;border-radius:9px;padding:13px 12px}#ballot-app nav button.active{background:#2c5745;color:#fff}#ballot-app nav button span{margin-left:8px}#ballot-app .aside-bottom{margin-top:auto;font-size:12px;color:#abc6b4}#ballot-app .aside-bottom strong{display:block;color:#d7edc3;font-size:16px;margin-bottom:5px}#ballot-app main{min-width:0;padding:26px 28px}#ballot-app .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px;flex-wrap:wrap}#ballot-app .overline{font-size:11px;color:var(--quiet);letter-spacing:1px}#ballot-app .group-name{font-size:16px;font-weight:700;margin-top:3px}#ballot-app .badge{padding:5px 10px;border-radius:30px;background:var(--soft);color:var(--brand);font-size:11px;white-space:nowrap}#ballot-app .demo{background:var(--surface);border:1px solid var(--stroke);color:var(--quiet);padding:5px 10px;border-radius:30px;font-size:11px}#ballot-app .head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}#ballot-app h1{font-size:29px;letter-spacing:-1px;margin:0 0 5px;line-height:1.3}#ballot-app p{margin:0;color:var(--quiet);font-size:12px}#ballot-app .btn{background:var(--soft);color:var(--ink);padding:10px 14px;border-radius:9px;min-height:40px;white-space:nowrap;font-size:12px}#ballot-app .btn.primary{background:var(--brand);color:var(--onbrand)}#ballot-app .panels{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:17px;align-items:start}#ballot-app .panel{background:var(--surface);border:1px solid var(--stroke);border-radius:15px;padding:20px;margin-bottom:16px}#ballot-app h2{font-size:15px;margin:0 0 5px}#ballot-app .row{display:flex;align-items:center;justify-content:space-between;gap:10px}#ballot-app .tiny{font-size:11px;color:var(--quiet)}#ballot-app .summary{background:var(--soft);border-radius:10px;padding:12px 14px;margin:15px 0 6px}#ballot-app .summary strong{font-size:22px;font-variant-numeric:tabular-nums}#ballot-app .track{height:5px;background:var(--stroke);border-radius:5px;overflow:hidden;margin:7px 0 5px}#ballot-app .track i{display:block;background:var(--brand);height:100%;transition:width .2s}#ballot-app .party-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;border-bottom:1px solid var(--stroke);padding:10px 0}#ballot-app .party-row:last-child{border:0}#ballot-app .party-label{display:flex;align-items:center;gap:9px;font-size:13px;min-width:0}#ballot-app .dot{width:7px;height:22px;border-radius:3px;flex-shrink:0}#ballot-app .stepper{display:flex;align-items:center;direction:ltr;justify-content:space-between}#ballot-app .stepper button{width:31px;height:32px;border-radius:7px;background:var(--page);color:var(--ink);font-size:19px}#ballot-app input[type=number]{width:43px;text-align:center;border:0;background:transparent;color:var(--ink);font-size:17px;font-weight:700;appearance:textfield;padding:4px 0}#ballot-app input::-webkit-inner-spin-button{appearance:none}#ballot-app .wide{width:100%;margin-top:15px}#ballot-app .chart{width:100%;display:block;margin:15px 0 4px}#ballot-app .chart text{fill:var(--ink);font-family:Arial,sans-serif}#ballot-app .legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--quiet)}#ballot-app .legend i{width:7px;height:7px;border-radius:100%;display:inline-block;margin-left:4px}#ballot-app .friend{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--stroke)}#ballot-app .friend:last-child{border:0}#ballot-app .avatar{width:31px;height:31px;display:grid;place-items:center;background:var(--soft);border-radius:10px;font-size:12px;color:var(--brand);flex-shrink:0}#ballot-app .friend-name{font-size:12px;flex:1}#ballot-app .check{font-size:11px;color:var(--brand)}#ballot-app .rule{padding:13px;background:var(--soft);border-radius:10px;margin-top:14px;font-size:12px}#ballot-app .rule strong{display:block;margin-bottom:5px}#ballot-app select,#ballot-app input[type=text],#ballot-app textarea{border:1px solid var(--stroke);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px;max-width:100%}#ballot-app select{font-size:12px}#ballot-app .foot{font-size:11px;color:var(--quiet);margin-top:15px}#ballot-app .message{font-size:12px;color:var(--brand);min-height:20px;margin-top:9px}#ballot-app table{width:100%;border-collapse:collapse;font-size:13px}#ballot-app th{font-size:11px;color:var(--quiet);font-weight:400}#ballot-app th,#ballot-app td{text-align:right;padding:14px 7px;border-bottom:1px solid var(--stroke)}#ballot-app .points{font-size:22px;font-weight:700}#ballot-app .add-form{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}#ballot-app .add-form input{min-width:0;flex:1}#ballot-app .hidden{display:none}#ballot-app .empty{padding:22px 5px;color:var(--quiet);text-align:center}#ballot-app .lock{background:none;color:var(--quiet);font-size:12px;padding:8px 0}#ballot-app .alert{color:light-dark(#a34931,#f3aa91)}#ballot-app .compare{background:var(--page);border-radius:8px;padding:9px 12px;margin-top:12px;font-size:12px}#ballot-app .text-btn{background:none;color:var(--brand);padding:9px 0;font-size:12px;text-align:right}#ballot-app .editnames{width:100%;min-height:190px;margin:12px 0;font:inherit;resize:vertical}
@media(max-width:800px){#ballot-app .layout{grid-template-columns:1fr;min-height:0}#ballot-app aside{padding:17px 20px;gap:15px}#ballot-app .brand{font-size:20px}#ballot-app .slogan,#ballot-app .aside-bottom{display:none}#ballot-app nav{display:flex;gap:6px;flex-wrap:wrap}#ballot-app nav button{font-size:12px;padding:9px}#ballot-app main{padding:20px}#ballot-app .top{margin-bottom:20px}}
@media(max-width:560px){#ballot-app .panels{grid-template-columns:1fr}#ballot-app .head{flex-wrap:wrap}#ballot-app h1{font-size:25px}#ballot-app main{padding:16px}#ballot-app .panel{padding:16px}#ballot-app .chart{max-width:310px;margin:15px auto}#ballot-app .stepper button{width:34px;height:40px}#ballot-app .stepper input{font-size:16px}#ballot-app .party-row{padding:8px 0}#ballot-app .btn{min-height:44px}}
</style>
<div class="layout">
<aside><div><div class="brand"><span class="mark">✓</span>הקלפי</div><div class="slogan">הפרשנים של קבוצת הוואטסאפ</div></div><nav aria-label="ניווט ראשי"><button data-tab="prediction" class="active"><span>▦</span>התחזית שלי</button><button data-tab="ranking"><span>♜</span>הדירוג של החבר׳ה</button><button data-tab="results"><span>◉</span>תוצאות האמת</button></nav><div class="aside-bottom"><strong>על נקודות.<br>ועל הכבוד.</strong>כל מנדט במקום הנכון<br>מקרב אתכם לניצחון.</div></aside>
<main><div class="top"><div><div class="overline">קבוצת החברים שלכם</div><div class="group-name">הפרלמנט של החבר׳ה</div></div><div class="row"><span class="demo">נתוני הדגמה</span><span class="badge" id="ballot-status">הניחושים פתוחים</span></div></div><div id="ballot-content"></div><div id="ballot-message" class="message" role="status" aria-live="polite"></div><div class="foot">גרסה מקומית לניסיון · ללא כסף או סנכרון בין חברים · רשימות לדוגמה, ניתנות לעריכה</div></main>
</div>
<script>
(()=>{
const root=document.getElementById('ballot-app');const $=s=>root.querySelector(s);
const names=['הליכוד','יש עתיד','המחנה הממלכתי','ש״ס','ישראל ביתנו','הדמוקרטים','יהדות התורה','הציונות הדתית','עוצמה יהודית','רשימות נוספות'];
const palette=['#326555','#679c89','#97b5a0','#c1cfa5','#d4b780','#b9946f','#8b9296','#71919e','#a395ac','#b7b9ad'];
const base=[28,20,16,11,10,9,8,7,6,5];
let s={names:[...names],players:[{id:1,name:'אני',v:[...base],saved:false},{id:2,name:'נועה',v:[26,22,15,12,10,10,8,6,6,5],saved:true},{id:3,name:'איתי',v:[30,18,16,12,9,9,8,7,6,5],saved:true},{id:4,name:'מיה',v:[24,24,16,11,10,10,8,6,6,5],saved:true}],actual:[...base],published:false,locked:false,selected:1};
let tab='prediction',storage=true;
const sum=v=>v.reduce((a,b)=>a+b,0);const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('ballot-visible-demo-v2',JSON.stringify(s))}catch(e){storage=false}}
try{let old=JSON.parse(localStorage.getItem('ballot-visible-demo-v2'));if(old&&Array.isArray(old.names)&&old.names.length>=2&&old.names.length<=20&&old.names.every(n=>typeof n==='string')&&Array.isArray(old.players)&&old.players.length&&old.players.every(p=>Number.isInteger(p.id)&&typeof p.name==='string'&&valid(p.v,old.names.length))&&valid(old.actual,old.names.length)&&old.players.some(p=>p.id===old.selected))s=old;}catch(e){storage=false}
function valid(v,n){return Array.isArray(v)&&v.length===n&&v.every(x=>Number.isInteger(x)&&x>=0&&x<=120)}
const current=()=>s.players.find(p=>p.id===s.selected);const score=p=>120-p.v.reduce((a,b,i)=>a+Math.abs(b-s.actual[i]),0)/2;
function tell(text){$('#ballot-message').textContent=text}
function rows(actual){let p=current(),v=actual?s.actual:p.v,disabled=actual?s.published:s.locked;return s.names.map((n,i)=>`<div class="party-row"><div class="party-label"><i class="dot" style="background:${palette[i%palette.length]}"></i>${escape(n)}</div><div class="stepper"><button data-change="${i}" data-delta="-1" aria-label="הפחת מנדט ל${escape(n)}" ${disabled?'disabled':''}>−</button><input id="seat-${i}" data-seat="${i}" type="number" min="0" max="120" step="1" value="${v[i]}" inputmode="numeric" aria-label="מנדטים ל${escape(n)}" ${disabled?'disabled':''}><button data-change="${i}" data-delta="1" aria-label="הוסף מנדט ל${escape(n)}" ${disabled?'disabled':''}>+</button></div></div>`).join('')}
function summary(){let v=tab==='results'?s.actual:current().v,t=sum(v);return `<div class="summary"><div class="row"><span>מנדטים שחולקו</span><div><strong id="seat-total">${t}</strong><span class="tiny"> / 120</span></div></div><div class="track"><i id="seat-progress" style="width:${Math.min(100,t/1.2)}%"></i></div><div class="tiny" id="seat-remaining"></div></div>`}
function chart(){const v=current().v;let categories=[];v.forEach((n,i)=>{for(let j=0;j<n&&categories.length<120;j++)categories.push(i)});let circles='',index=0;for(let row=0;row<5;row++){let count=16+row*4,r=47+row*16;for(let i=0;i<count;i++){let angle=Math.PI+(Math.PI*i/(count-1)),x=140+r*Math.cos(angle),y=133+r*Math.sin(angle),cat=categories[index++];circles+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="4.6" fill="${cat===undefined?'var(--stroke)':palette[cat%palette.length]}"></circle>`}}return `<svg class="chart" viewBox="0 0 280 155" role="img" aria-label="חלוקת 120 מושבי הכנסת לפי התחזית; המנדטים מפורטים ברשימות"><g>${circles}</g><text x="140" y="122" text-anchor="middle" font-size="28" font-weight="700">${Math.min(120,sum(v))}</text><text x="140" y="143" text-anchor="middle" font-size="11">מושבים בכנסת שלכם</text></svg>`}
function friends(){return s.players.map(p=>`<div class="friend"><span class="avatar">${escape(p.name[0])}</span><div class="friend-name">${escape(p.name)}${p.id===s.selected?' <span class="tiny">(נבחר)</span>':''}</div><span class="${p.saved?'check':'tiny'}">${p.saved?'הוגש ✓':'טיוטה'}</span></div>`).join('')}
function render(){
$('#ballot-status').textContent=s.published?'התוצאות פורסמו':s.locked?'הניחושים נעולים':'הניחושים פתוחים';root.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));tell('');
const p=current();let html='';
if(tab==='prediction')html=`<div class="head"><div><h1>מה התחזית שלכם?</h1><p>120 מנדטים. החבר שהכי קרוב — מנצח.</p></div><select id="player-pick" aria-label="בחירת משתתף">${s.players.map(p=>`<option value="${p.id}" ${p.id===s.selected?'selected':''}>${escape(p.name)}</option>`).join('')}</select></div><div class="panels"><section class="panel"><div class="row"><h2>חלוקת המנדטים</h2><span class="tiny">${p.saved?'התחזית הוגשה ✓':'טיוטה אישית'}</span></div>${summary()}${rows(false)}<button class="btn primary wide" id="submit">${p.saved?'התחזית הוגשה ✓':'הגשת התחזית ←'}</button><div class="tiny" style="margin-top:8px">אפשר לשנות ולהגיש מחדש עד לנעילה.</div></section><div><section class="panel"><div class="row"><h2>הכנסת שלכם</h2><span class="tiny">120 מושבים</span></div><div id="seat-chart">${chart()}</div><div class="rule"><strong>איך סופרים נקודות?</strong>120 פחות מספר המנדטים שצריך להעביר בין רשימות כדי להגיע לתוצאה האמיתית.</div></section><section class="panel"><div class="row"><h2>החבר׳ה</h2><span class="badge">${s.players.length} בקבוצה</span></div>${friends()}<button class="text-btn" id="show-add" ${s.locked?'disabled':''}>＋ הוספת חבר</button><form id="add-form" class="add-form hidden"><input id="friend-name" type="text" maxlength="30" placeholder="שם החבר" aria-label="שם החבר" required><button class="btn primary" type="submit">הוספה</button></form></section></div></div>`;
if(tab==='ranking'){let sorted=s.players.filter(p=>p.saved).sort((a,b)=>s.published?score(b)-score(a):a.id-b.id),rank=0,last=null;html=`<div class="head"><div><h1>הפרשנים של החבורה</h1><p>${s.published?'התוצאות בפנים. עכשיו אפשר להתווכח על משהו אחר.':'הניחושים מוכנים. הדירוג יחושב אחרי הזנת תוצאות האמת.'}</p></div><span class="badge">${sorted.length} תחזיות הוגשו</span></div><section class="panel">${sorted.length?`<table><thead><tr><th>מקום</th><th>החבר׳ה</th><th>ניקוד</th><th>תחזית</th></tr></thead><tbody>${sorted.map((p,i)=>{let pts=score(p);if(pts!==last){last=pts;rank=i+1}return `<tr><td>${s.published?(rank===1?'🏆':rank):'—'}</td><td>${escape(p.name)}</td><td><span class="points">${s.published?pts:'—'}</span></td><td><button class="btn" data-inspect="${p.id}">צפייה</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">עדיין לא הוגשו תחזיות</div>'}<div class="row" style="margin-top:18px"><p>${s.players.filter(p=>!p.saved).length} משתתפים עדיין לא הגישו</p><button class="btn primary" data-go="results">הזנת תוצאות האמת ←</button></div></section>`;}
if(tab==='results')html=`<div class="head"><div><h1>רגע האמת</h1><p>מזינים תוצאות ידנית ומגלים מי קרא נכון את המפה.</p></div><span class="badge">${s.published?'פורסם':'הזנה ידנית'}</span></div><div class="panels"><section class="panel"><h2>תוצאות הבחירות</h2><p>הערכים המוצגים הם נתוני הדגמה בלבד.</p>${summary()}${rows(true)}<button class="btn primary wide" id="publish">${s.published?'התוצאות פורסמו ✓':'פרסום התוצאות וחישוב הדירוג'}</button>${s.published?'<button class="text-btn" id="edit-results">תיקון התוצאות</button>':''}</section><div><section class="panel"><h2>ניהול הניחושים</h2><p>נעילה מונעת עריכת תחזיות במכשיר הזה. פרסום התוצאות נועל אותן אוטומטית.</p><button class="btn wide" id="toggle-lock" ${s.published?'disabled':''}>${s.locked?'פתיחה מחדש לעריכה':'נעילת כל התחזיות'}</button><div class="rule"><strong>הניקוד שקוף</strong>ניחוש מושלם: 120 נקודות.<br>3 מנדטים שצריך להעביר: 117 נקודות.<br>שוויון בניקוד = אותו מקום.</div></section><section class="panel"><h2>הרשימות שלכם</h2><p>אפשר להתחיל קבוצה חדשה עם רשימות אחרות. הפעולה מוחקת את התחזיות הנוכחיות.</p><button class="text-btn" id="edit-parties">עריכת רשימות ופתיחת קבוצה חדשה</button><div id="names-editor" class="hidden"><textarea class="editnames" id="party-names" aria-label="שמות הרשימות">${escape(s.names.join('\n'))}</textarea><button class="btn" id="reset-party">אישור ואיפוס הקבוצה</button></div></section></div></div>`;
$('#ballot-content').innerHTML=html;bind();if(tab!=='ranking')refresh();
}
function refresh(){const actual=tab==='results',v=actual?s.actual:current().v,t=sum(v),disabled=actual?s.published:s.locked;$('#seat-total').textContent=t;$('#seat-progress').style.width=Math.min(100,t/1.2)+'%';$('#seat-remaining').textContent=t===120?'בדיוק 120. אפשר להגיש.':t<120?`עוד ${120-t} מנדטים לחלוקה`:`צריך להפחית ${t-120} מנדטים`;$('#seat-remaining').classList.toggle('alert',t>120);const b=actual?$('#publish'):$('#submit');b.disabled=disabled||t!==120||(!actual&&current().saved);if(!actual){$('#seat-chart').innerHTML=chart();b.textContent=current().saved?'התחזית הוגשה ✓':'הגשת התחזית ←';}}
function change(i,n){let actual=tab==='results';if(actual?s.published:s.locked)return;let v=actual?s.actual:current().v;if(!Number.isInteger(n)||n<0||n>120)return;if(!actual&&v[i]!==n)current().saved=false;v[i]=n;persist();refresh()}
function bind(){
root.querySelectorAll('[data-seat]').forEach(e=>{e.addEventListener('input',()=>change(+e.dataset.seat,Number(e.value)));e.addEventListener('blur',()=>e.value=(tab==='results'?s.actual:current().v)[+e.dataset.seat]);});
root.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{let i=+b.dataset.change,v=tab==='results'?s.actual:current().v;change(i,Math.min(120,Math.max(0,v[i]+Number(b.dataset.delta))));$('#seat-'+i).value=v[i]});
root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
root.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.inspect;tab='prediction';render()});
if($('#player-pick'))$('#player-pick').onchange=e=>{s.selected=+e.target.value;persist();render()};
if($('#submit'))$('#submit').onclick=()=>{if(s.locked||sum(current().v)!==120)return;current().saved=true;persist();render();tell(storage?'התחזית הוגשה ונשמרה בדפדפן.':'התחזית הוגשה בתצוגה הזו; שמירה קבועה אינה זמינה.')};
if($('#show-add'))$('#show-add').onclick=()=>{$('#add-form').classList.toggle('hidden');if(!$('#add-form').classList.contains('hidden'))$('#friend-name').focus()};
if($('#add-form'))$('#add-form').onsubmit=e=>{e.preventDefault();if(s.locked)return;let name=$('#friend-name').value.trim();if(!name)return;s.selected=Math.max(...s.players.map(p=>p.id))+1;s.players.push({id:s.selected,name:name.slice(0,30),v:s.names.map(()=>0),saved:false});persist();render();tell('נוסף משתתף. אפשר להזין את התחזית שלו במכשיר הזה.')};
if($('#publish'))$('#publish').onclick=()=>{if(sum(s.actual)!==120||s.published)return;s.published=true;s.locked=true;persist();tab='ranking';render();tell('הדירוג חושב על פי התוצאות שהזנתם.')};
if($('#edit-results'))$('#edit-results').onclick=()=>{s.published=false;persist();render()};
if($('#toggle-lock'))$('#toggle-lock').onclick=()=>{if(s.published)return;s.locked=!s.locked;persist();render();tell(s.locked?'התחזיות נעולות.':'התחזיות נפתחו לעריכה.')};
if($('#edit-parties'))$('#edit-parties').onclick=()=>$('#names-editor').classList.toggle('hidden');
if($('#reset-party'))$('#reset-party').onclick=()=>{let names=$('#party-names').value.split('\n').map(n=>n.trim()).filter(Boolean);if(names.length<2||names.length>20||names.some(n=>n.length>50)||new Set(names).size!==names.length)return tell('צריך 2–20 רשימות עם שמות שונים, עד 50 תווים לשם.');s.names=names;s.players=[{id:1,name:'אני',v:names.map(()=>0),saved:false}];s.selected=1;s.actual=names.map(()=>0);s.locked=false;s.published=false;persist();tab='prediction';render();tell('נפתחה קבוצה חדשה עם הרשימות שבחרתם.')};
}
root.querySelectorAll('nav [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
})();
</script>
</div>

</body>
</html>
